<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天马门禁">
<meta name="description" content="天马创新 WiFi 门禁 · 下拉工牌开门">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>天马门禁</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js"}}
</script>
</head>
<body>
<div class="bg" id="bgFx" aria-hidden="true"></div>
<div class="stage" id="stage" aria-label="天马创新门禁工牌"></div>

<header class="bar">
  <div class="brand"><b>天马创新</b><span>门禁</span></div>
  <button class="pill" id="netPill" type="button" aria-label="设备连接设置">
    <i></i><span id="netText">连接中</span>
  </button>
</header>

<div class="bottom">
  <div class="meter" id="meter"><i id="meterFill"></i></div>
  <div class="state" id="stateWrap"><span class="dot"></span><b id="stateText">正在连接</b></div>
  <div class="hint" id="hintText">下拉工牌开门 · 点击翻面</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
  <b id="toastText">已开门</b><em id="toastSub"></em>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true" aria-label="设备地址">
  <div class="sheetHead">
    <h2>设备地址</h2>
    <button type="button" id="sheetClose">完成</button>
  </div>
  <label class="cap">远程地址 · HTTPS 隧道（可留空）</label>
  <input class="input" id="remoteInput" type="text" inputmode="url" autocomplete="off"
         autocapitalize="off" spellcheck="false" placeholder="https://mj-api.frospon.top">
  <label class="cap">局域网地址 · 端口固定 48733</label>
  <input class="input" id="localInput" type="text" inputmode="url" autocomplete="off"
         autocapitalize="off" spellcheck="false" placeholder="192.168.31.216">
  <p class="tip">断网时自动改用局域网地址；iPhone 上局域网可能被拦截，连接后下拉工牌开门。</p>
  <button class="btn" id="saveBtn" type="button">保存并重连</button>
  <button class="linkBtn" id="testBtn" type="button">在新窗口打开设备 /status 测试</button>
  <div class="diag" id="diag"></div>
</section>

<section class="sheet" id="lingSheet" aria-hidden="true" aria-label="切换工牌">
  <div class="sheetHead">
    <h2>切换工牌</h2>
    <button type="button" id="lingClose">完成</button>
  </div>
  <label class="cap">当前工牌</label>
  <p class="tip" id="lingNow">小马 · 0000</p>
  <label class="cap">工牌密令</label>
  <input class="input" id="lingInput" type="text" autocomplete="off"
         autocapitalize="off" spellcheck="false" placeholder="8 位密令">
  <p class="tip">密令由设备端验证，仅有效密令可开门。</p>
  <button class="btn" id="lingSave" type="button">验证并切换</button>
</section>

<noscript><div class="noscript">请开启 JavaScript 以使用门禁控制。</div></noscript>

<script src="vendor/gsap.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
